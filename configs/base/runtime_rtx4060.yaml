# RTX 4060 Laptop (8 GB VRAM), WSL2 Ubuntu. Measured budget is ~7.3 GiB usable after the
# CUDA context and the Windows display driver. Run scripts/profile_hardware.py first.
runtime:
  device: cuda
  precision: bf16          # autocast; RTX 40xx supports bf16
  param_dtype: bf16        # latent weights stored in bf16 (optimizer keeps its own state)
  micro_batch_size: 1
  grad_accum_steps: 32
  seq_len: 2048
  seq_len_schedule: [[0, 512], [200, 1024], [600, 2048]]   # short sequences first: cheap warm-up
  eval_batch_size: 1
  eval_seq_len: 1024
  log_interval: 10
  checkpoint_interval: 200
  keep_last: 3
  loss_chunk: 1024         # never materialise full 128k-vocab fp32 logits
