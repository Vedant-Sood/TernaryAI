# trimath: ternary-preserving LoRA on all 30 blocks. The low-rank delta is added to the latent weight
# BEFORE absmean ternarization, so forward weights stay in {-1,0,+1}; adapters are merged and
# re-ternarized at export. This is not QLoRA: no dense adapter exists in the exported model.
inherit:
- ../base/runtime_rtx4060.yaml
- ../base/optim_qat_finetune.yaml
- ../base/bitnet2b.yaml
run:
  name: trimath-2b-lora
  specialist: trimath
  output_dir: checkpoints/trimath/bitnet2b_lora
  seed: 1337
model:
  strategy: lora
  lora_rank: 32
data:
  version: v1-bitnet
  dir: data/trimath/v1-bitnet
  sources:
  - key: numinamath_cot
    max_examples: 150000
  - key: openmathinstruct2
    max_examples: 100000
  - key: gsm8k_train
    weight: 2
  - key: synthetic
    n: 10000
    seed: 0
optim:
  lr: 0.0002
  max_steps: 600
runtime:
  seq_len: 1024
  seq_len_schedule:
  - - 0
    - 512
  - - 200
    - 1024
