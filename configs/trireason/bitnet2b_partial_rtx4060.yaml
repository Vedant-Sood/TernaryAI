# trireason: full local fine-tuning experiment on an 8 GB RTX 4060.
# Quantization-aware fine-tuning of BitNet b1.58 2B4T: the last 8 of 30 blocks keep bf16 latent weights
# and train with ternary forward weights (STE); the other 22 blocks are frozen as packed 2-bit codes.
# Every forward weight in the model is ternary throughout.
inherit:
- ../base/runtime_rtx4060.yaml
- ../base/optim_qat_finetune.yaml
- ../base/bitnet2b.yaml
run:
  name: trireason-2b-partial
  specialist: trireason
  output_dir: checkpoints/trireason/bitnet2b_partial
  seed: 1337
model:
  strategy: partial
  trainable_layers: last:8
  frozen_cache_codes: false
data:
  version: v1-bitnet
  dir: data/trireason/v1-bitnet
  sources:
  - key: webinstruct_sub
    max_examples: 150000
    keep_regex: \b(physics|velocity|acceleration|force|energy|momentum|circuit|voltage|current|resist|thermo|entropy|heat|pressure|chemi|reaction|molar|engineer|stress|strain|beam|fluid|wave|frequency|optic|electr|magnet|quantum|statistic|experiment|logic)\w*
    drop_regex: ^\s*(prove that|find the integral|evaluate the integral|simplify)
  - key: arc_train
    weight: 2
  - key: synthetic
    n: 10000
    seed: 0
optim:
  max_steps: 600
