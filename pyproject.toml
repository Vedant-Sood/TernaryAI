[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triforge"
version = "0.1.0"
description = "TriForge: specialised ternary-weight ({-1, 0, +1}) language models (TriCode, TriMath, TriReason)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",  # >=2.6: CVE-2025-32434 (torch.load weights_only=True bypass)
    "numpy",
    "safetensors>=0.4",
    "pyyaml",
    "psutil",
    "tokenizers>=0.19",
]

[project.optional-dependencies]
hf = ["transformers>=4.53", "datasets>=2.19", "accelerate>=0.30", "huggingface_hub>=0.23", "peft>=0.11"]
serve = ["fastapi>=0.110", "starlette>=1.3.1", "uvicorn>=0.29", "h11>=0.16"]
gpu = ["bitsandbytes>=0.43; platform_system == 'Linux'"]
dev = ["pytest>=8", "httpx"]

[project.scripts]
triforge = "triforge.inference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer CPU tests", "gpu: needs CUDA", "network: needs internet"]
